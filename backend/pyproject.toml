[project]
name = "bitnbuild-backend"
version = "0.1.0"
description = "Karnataka industrial byproduct exchange - API and negotiation agents"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "own_database: test manages its own schema; skip the per-test database reset",
]
